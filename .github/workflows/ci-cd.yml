name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    env:
      PROD_SSH: ${{ secrets.PROD_SSH || 'paas-prod' }}
      PROD_DIR: ${{ secrets.PROD_DIR || '/opt/laravel-paas' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Base Commit
        id: base-commit
        run: |
          BASE_SHA=""
          BEFORE_SHA="${{ github.event.before }}"
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
              BASE_SHA="$BEFORE_SHA"
              echo "Base commit $BEFORE_SHA exists locally."
            else
              echo "Base commit $BEFORE_SHA does not exist locally (possibly due to force-push)."
            fi
          else
            echo "No valid before SHA provided (possibly a new branch)."
          fi

          if [ -z "$BASE_SHA" ]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              BASE_SHA=$(git rev-parse HEAD~1)
              echo "Resolved HEAD~1 locally to $BASE_SHA"
            else
              BASE_SHA=$(git rev-parse HEAD)
              echo "HEAD~1 not available. Resolved to current HEAD: $BASE_SHA"
            fi
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.base-commit.outputs.base_sha }}
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'go.work'

            worker:
              - 'worker/**'
              - 'shared/**'
              - 'go.work'

            frontend:
              - 'frontend/**'

            deploy_scripts:
              - 'scripts/**'
              - '.github/actions/**'

            ci:
              - '.github/workflows/**'

      - name: Print Change Detection
        run: |
          echo "backend=${{ steps.filter.outputs.backend }}"
          echo "worker=${{ steps.filter.outputs.worker }}"
          echo "frontend=${{ steps.filter.outputs.frontend }}"
          echo "deploy_scripts=${{ steps.filter.outputs.deploy_scripts }}"
          echo "ci=${{ steps.filter.outputs.ci }}"

      - name: Sync Codebase to Production
        run: |
          set -euo pipefail

          ssh "$PROD_SSH" bash -s -- "$PROD_DIR" "${{ github.ref_name }}" <<'REMOTE'
          set -euo pipefail

          PROD_DIR="$1"
          GIT_REF="$2"

          cd "$PROD_DIR"

          git config --global --add safe.directory "$PROD_DIR"

          git fetch origin
          git checkout "$GIT_REF"
          git reset --hard "origin/$GIT_REF"
          REMOTE

      - name: Conditional Deployment
        run: |
          set -euo pipefail

          BACKEND="${{ steps.filter.outputs.backend }}"
          WORKER="${{ steps.filter.outputs.worker }}"
          FRONTEND="${{ steps.filter.outputs.frontend }}"
          DEPLOY_SCRIPTS="${{ steps.filter.outputs.deploy_scripts }}"
          CI="${{ steps.filter.outputs.ci }}"

          ssh "$PROD_SSH" bash -s -- "$PROD_DIR" "$BACKEND" "$WORKER" "$FRONTEND" "$DEPLOY_SCRIPTS" "$CI" <<'REMOTE'
          set -euo pipefail

          PROD_DIR="$1"
          NEED_BACKEND="$2"
          NEED_WORKER="$3"
          NEED_FRONTEND="$4"
          DEPLOY_SCRIPTS="$5"
          CI="$6"

          cd "$PROD_DIR"

          chmod +x ./scripts/deploy-app.sh

          if [ "$NEED_BACKEND" = "true" ] && [ "$NEED_WORKER" = "true" ] && [ "$NEED_FRONTEND" = "true" ]; then
            echo "[CI/CD] Full stack changes detected. Deploying ALL."
            ./scripts/deploy-app.sh all
          else
            if [ "$NEED_BACKEND" = "true" ]; then
              echo "[CI/CD] Deploying BACKEND."
              ./scripts/deploy-app.sh backend
            fi
            if [ "$NEED_WORKER" = "true" ]; then
              echo "[CI/CD] Deploying WORKER."
              ./scripts/deploy-app.sh worker
            fi
            if [ "$NEED_FRONTEND" = "true" ]; then
              echo "[CI/CD] Deploying FRONTEND."
              ./scripts/deploy-app.sh frontend
            fi
          fi

          if [ "$NEED_BACKEND" = "false" ] && [ "$NEED_WORKER" = "false" ] && [ "$NEED_FRONTEND" = "false" ]; then
            if [ "$CI" = "true" ]; then
              echo "[CI/CD] CI workflow changes only. Skipping deployment."
            else
              if [ "$DEPLOY_SCRIPTS" = "true" ]; then
                echo "[CI/CD] Deployment script changes only. Skipping app deployment."
              else
                echo "[CI/CD] No relevant changes detected."
              fi
            fi
          fi
          REMOTE

      - name: Notification on Success
        if: success()
        run: |
          set +x

          ssh "$PROD_SSH" bash -s -- "$PROD_DIR" "${{ github.ref_name }}" <<'REMOTE'
          set +x

          PROD_DIR="$1"
          GIT_REF="$2"

          if [ -f "$PROD_DIR/.env" ]; then
            set -a
            source "$PROD_DIR/.env"
            set +a
          fi

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            exit 0
          fi

          cd "$PROD_DIR"

          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")

          LAST_COMMIT_MSG=$(git log -1 --pretty=format:"%s" \
            | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          MSG="DEPLOY SUCCESS%0A"
          MSG="${MSG}Branch: $GIT_REF%0A"
          MSG="${MSG}Commit: $COMMIT_HASH%0A"
          MSG="${MSG}Log: $LAST_COMMIT_MSG"

          TELEGRAM_API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

          IFS=',' read -ra CHAT_IDS <<< "$TELEGRAM_CHAT_ID"

          for CHAT_ID in "${CHAT_IDS[@]}"; do
            curl -fsS -X POST "$TELEGRAM_API" \
              -d chat_id="$CHAT_ID" \
              -d text="$MSG" \
              -d parse_mode="HTML" \
              > /dev/null
          done
          REMOTE

      - name: Notification on Failure
        if: failure()
        run: |
          set +x

          ssh "$PROD_SSH" bash -s -- "$PROD_DIR" "${{ github.ref_name }}" <<'REMOTE'
          set +x

          PROD_DIR="$1"
          GIT_REF="$2"

          if [ -f "$PROD_DIR/.env" ]; then
            set -a
            source "$PROD_DIR/.env"
            set +a
          fi

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            exit 0
          fi

          cd "$PROD_DIR"

          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")

          MSG="DEPLOY FAILED%0A"
          MSG="${MSG}Branch: $GIT_REF%0A"
          MSG="${MSG}Commit: $COMMIT_HASH"

          TELEGRAM_API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

          IFS=',' read -ra CHAT_IDS <<< "$TELEGRAM_CHAT_ID"

          for CHAT_ID in "${CHAT_IDS[@]}"; do
            curl -fsS -X POST "$TELEGRAM_API" \
              -d chat_id="$CHAT_ID" \
              -d text="$MSG" \
              -d parse_mode="HTML" \
              > /dev/null
          done
          REMOTE
