name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # ==========================================================
  # CODE QUALITY & SECURITY SCANNING
  # ==========================================================
  semgrep:
    name: Semgrep Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        with:
          config: >-
            p/default
            p/security-audit
            p/secrets

  # ==========================================================
  # CI/CD PIPELINE
  # Runs directly on /opt/laravel-paas without checking out new dirs
  # ==========================================================
  pipeline:
    runs-on: self-hosted
    steps:
      # 1. Update Codebase (In Place)
      - name: Update Codebase
        run: |
          TARGET_DIR="/opt/laravel-paas"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "[ERROR] Directory $TARGET_DIR does not exist!"
            exit 1
          fi
          
          cd "$TARGET_DIR"
          echo "[INFO] Working directory: $(pwd)"
          
          # Ensure git trusts this directory
          git config --global --add safe.directory "$TARGET_DIR"
          
          echo "[INFO] Pulling latest changes for branch ${{ github.ref_name }}..."
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}

      # 2. Deployment / Restart
      # Builds logic is handled inside Docker build (via start.sh)
      - name: Restart Infrastructure
        run: |
          cd /opt/laravel-paas
          echo "[INFO] Restarting Services..."
          
          if [ -f "./scripts/start.sh" ]; then
            chmod +x ./scripts/start.sh
            ./scripts/start.sh
          else
            echo "[ERROR] scripts/start.sh not found!"
            exit 1
          fi
          
          echo "[SUCCESS] Deployment Successful!"

      # 6. Notifications
      - name: Notify Success
        if: success()
        run: |
          if [ -f /opt/laravel-paas/.env ]; then
            set -a; source /opt/laravel-paas/.env; set +a
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials missing, skipping."
            exit 0
          fi

          cd /opt/laravel-paas
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          LAST_COMMIT_MSG=$(git log -1 --pretty=format:"%s" | sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g')

          MSG="[SUCCESS] <b>Laravel PaaS Deploy SUKSES!</b>%0A%0A"
          MSG="${MSG}<b>Branch:</b> <code>${{ github.ref_name }}</code>%0A"
          MSG="${MSG}<b>Commit:</b> <code>$COMMIT_HASH</code>%0A"
          MSG="${MSG}<b>Log:</b> $LAST_COMMIT_MSG%0A%0A"
          MSG="${MSG}Services restarted & live."

          set +x
          TELEGRAM_API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          IFS=',' read -ra CHAT_IDS <<< "$TELEGRAM_CHAT_ID"
          for CHAT_ID in "${CHAT_IDS[@]}"; do
            curl -s -X POST "$TELEGRAM_API" -d chat_id="$CHAT_ID" -d text="$MSG" -d parse_mode="HTML" > /dev/null 2>&1
          done

      - name: Notify Failure
        if: failure()
        run: |
          if [ -f /opt/laravel-paas/.env ]; then
             set -a; source /opt/laravel-paas/.env; set +a
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then exit 0; fi
          
          cd /opt/laravel-paas
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")

          MSG="[FAILED] <b>Laravel PaaS Deploy GAGAL!</b>%0A%0A"
          MSG="${MSG}Pipeline stopped at error.%0A"
          MSG="${MSG}<b>Branch:</b> <code>${{ github.ref_name }}</code>%0A"
          MSG="${MSG}<b>Commit:</b> <code>$COMMIT_HASH</code>%0A"
          MSG="${MSG}Check GitHub Actions logs."

          set +x
          TELEGRAM_API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          IFS=',' read -ra CHAT_IDS <<< "$TELEGRAM_CHAT_ID"
          for CHAT_ID in "${CHAT_IDS[@]}"; do
            curl -s -X POST "$TELEGRAM_API" -d chat_id="$CHAT_ID" -d text="$MSG" -d parse_mode="HTML" > /dev/null 2>&1
          done