name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: self-hosted
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: runara_billing_test
          POSTGRES_USER: runara
          POSTGRES_PASSWORD: runara
        options: >-
          --health-cmd "pg_isready -U runara -d runara_billing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      BILLING_TEST_DATABASE_URL: postgres://runara:runara@localhost:5432/runara_billing_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@0a12c4c30c7b1459b839ed93c8aefbd7f7d2c10d # v5.0.2
        with:
          go-version: "1.22"
      - name: Test and scan Go modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.8.0
          for module in backend shared worker; do
            (cd "$module" && go vet ./... && go test ./... && govulncheck ./...) 2>&1 | tee "reports/${module}-go.txt"
            (cd "$module" && cyclonedx-gomod mod -json -output "../reports/${module}.cdx.json")
          done
      - name: Test PostgreSQL billing schema
        shell: bash
        run: |
          set -euo pipefail
          (cd shared && go test -tags=integration ./database) 2>&1 | tee reports/billing-postgres.txt
          (cd backend && go test -tags=integration ./internal/services/billing) 2>&1 | tee reports/wallet-postgres.txt
      - uses: actions/setup-node@1e60f620b9541d9d1a79b4de2b0e4db7e605a10d # v4.0.3
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint, audit, build, and generate frontend SBOM
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm audit --audit-level=high --json > ../reports/npm-audit.json
          npm run build
          npx --yes @cyclonedx/cyclonedx-npm@1.20.0 --output-file ../reports/frontend.cdx.json
      - name: Scan committed secrets
        shell: bash
        run: |
          set -euo pipefail
          GOTOOLCHAIN=go1.23.8 go install github.com/zricethezav/gitleaks/v8@v8.28.0
          gitleaks detect --source . --baseline-path .gitleaks/baseline.json --redact --report-format json --report-path reports/gitleaks.json
      - name: Check launch and Traefik policy
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-worker-secret-isolation.sh
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: security-evidence-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: checks
    if: github.event_name == 'push'
    runs-on: self-hosted
    env:
      PROD_SSH: paas-prod
      PROD_DIR: /mainData/laravel-paas

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Determine Base Commit
        id: base-commit
        run: |
          BASE_SHA=""
          BEFORE_SHA="${{ github.event.before }}"
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
              BASE_SHA="$BEFORE_SHA"
              echo "Base commit $BEFORE_SHA exists locally."
            else
              echo "Base commit $BEFORE_SHA does not exist locally (possibly due to force-push)."
            fi
          else
            echo "No valid before SHA provided (possibly a new branch)."
          fi

          if [ -z "$BASE_SHA" ]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              BASE_SHA=$(git rev-parse HEAD~1)
              echo "Resolved HEAD~1 locally to $BASE_SHA"
            else
              BASE_SHA=$(git rev-parse HEAD)
              echo "HEAD~1 not available. Resolved to current HEAD: $BASE_SHA"
            fi
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Detect Changes
        uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050 # v3
        id: filter
        with:
          base: ${{ steps.base-commit.outputs.base_sha }}
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'go.work'

            worker:
              - 'worker/**'
              - 'shared/**'
              - 'go.work'

            frontend:
              - 'frontend/**'

            deploy_scripts:
              - 'scripts/**'
              - '.github/actions/**'

            ci:
              - '.github/workflows/**'

      - name: Print Change Detection
        run: |
          echo "backend=${{ steps.filter.outputs.backend }}"
          echo "worker=${{ steps.filter.outputs.worker }}"
          echo "frontend=${{ steps.filter.outputs.frontend }}"
          echo "deploy_scripts=${{ steps.filter.outputs.deploy_scripts }}"
          echo "ci=${{ steps.filter.outputs.ci }}"

      - name: Sync Codebase to Production
        run: |
          set -euo pipefail

          ssh "$PROD_SSH" bash -s -- "$PROD_DIR" "${{ github.ref_name }}" <<'REMOTE'
          set -euo pipefail

          PROD_DIR="$1"
          GIT_REF="$2"

          cd "$PROD_DIR"

          git config --global --add safe.directory "$PROD_DIR"

          git fetch origin
          git checkout "$GIT_REF"
          git reset --hard "origin/$GIT_REF"
          REMOTE

      - name: Conditional Deployment
        run: |
          set -euo pipefail

          BACKEND="${{ steps.filter.outputs.backend }}"
          WORKER="${{ steps.filter.outputs.worker }}"
          FRONTEND="${{ steps.filter.outputs.frontend }}"
          DEPLOY_SCRIPTS="${{ steps.filter.outputs.deploy_scripts }}"
          CI="${{ steps.filter.outputs.ci }}"

          NEED_BACKEND=false
          NEED_WORKER=false
          NEED_FRONTEND=false

          if [ "$BACKEND" = "true" ]; then
            NEED_BACKEND=true
          fi

          if [ "$WORKER" = "true" ]; then
            NEED_WORKER=true
          fi

          if [ "$FRONTEND" = "true" ]; then
            NEED_FRONTEND=true
          fi

          ssh "$PROD_SSH" bash -s -- "$PROD_DIR" "$NEED_BACKEND" "$NEED_WORKER" "$NEED_FRONTEND" "$DEPLOY_SCRIPTS" "$CI" <<'REMOTE'
          set -euo pipefail

          PROD_DIR="$1"
          NEED_BACKEND="$2"
          NEED_WORKER="$3"
          NEED_FRONTEND="$4"
          DEPLOY_SCRIPTS="$5"
          CI="$6"

          cd "$PROD_DIR"

          chmod +x ./scripts/deploy-app.sh

          if [ "$NEED_BACKEND" = "true" ] && [ "$NEED_WORKER" = "true" ] && [ "$NEED_FRONTEND" = "true" ]; then
            echo "[CI/CD] Full stack changes detected. Deploying ALL."
            ./scripts/deploy-app.sh all
          else
            if [ "$NEED_BACKEND" = "true" ]; then
              echo "[CI/CD] Deploying BACKEND."
              ./scripts/deploy-app.sh backend
            fi
            if [ "$NEED_WORKER" = "true" ]; then
              echo "[CI/CD] Deploying WORKER."
              ./scripts/deploy-app.sh worker
            fi
            if [ "$NEED_FRONTEND" = "true" ]; then
              echo "[CI/CD] Deploying FRONTEND."
              ./scripts/deploy-app.sh frontend
            fi
          fi

          if [ "$NEED_BACKEND" = "false" ] && [ "$NEED_WORKER" = "false" ] && [ "$NEED_FRONTEND" = "false" ]; then
            if [ "$CI" = "true" ]; then
              echo "[CI/CD] CI workflow changes only. Skipping deployment."
            else
              if [ "$DEPLOY_SCRIPTS" = "true" ]; then
                echo "[CI/CD] Deployment script changes only. Skipping app deployment."
              else
                echo "[CI/CD] No relevant changes detected."
              fi
            fi
          fi
          REMOTE

      - name: Notification on Success
        if: success()
        run: |
          set +x

          ssh "$PROD_SSH" bash -s -- "$PROD_DIR" "${{ github.ref_name }}" <<'REMOTE'
          set +x

          PROD_DIR="$1"
          GIT_REF="$2"

          if [ -f "$PROD_DIR/.env" ]; then
            set -a
            source "$PROD_DIR/.env"
            set +a
          fi

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            exit 0
          fi

          cd "$PROD_DIR"

          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")

          LAST_COMMIT_MSG=$(git log -1 --pretty=format:"%s" \
            | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          MSG="DEPLOY SUCCESS%0A"
          MSG="${MSG}Branch: $GIT_REF%0A"
          MSG="${MSG}Commit: $COMMIT_HASH%0A"
          MSG="${MSG}Log: $LAST_COMMIT_MSG"

          TELEGRAM_API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

          IFS=',' read -ra CHAT_IDS <<< "$TELEGRAM_CHAT_ID"

          for CHAT_ID in "${CHAT_IDS[@]}"; do
            curl -fsS -X POST "$TELEGRAM_API" \
              -d chat_id="$CHAT_ID" \
              -d text="$MSG" \
              -d parse_mode="HTML" \
              > /dev/null
          done
          REMOTE

      - name: Notification on Failure
        if: failure()
        run: |
          set +x

          ssh "$PROD_SSH" bash -s -- "$PROD_DIR" "${{ github.ref_name }}" <<'REMOTE'
          set +x

          PROD_DIR="$1"
          GIT_REF="$2"

          if [ -f "$PROD_DIR/.env" ]; then
            set -a
            source "$PROD_DIR/.env"
            set +a
          fi

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            exit 0
          fi

          cd "$PROD_DIR"

          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")

          MSG="DEPLOY FAILED%0A"
          MSG="${MSG}Branch: $GIT_REF%0A"
          MSG="${MSG}Commit: $COMMIT_HASH"

          TELEGRAM_API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

          IFS=',' read -ra CHAT_IDS <<< "$TELEGRAM_CHAT_ID"

          for CHAT_ID in "${CHAT_IDS[@]}"; do
            curl -fsS -X POST "$TELEGRAM_API" \
              -d chat_id="$CHAT_ID" \
              -d text="$MSG" \
              -d parse_mode="HTML" \
              > /dev/null
          done
          REMOTE
