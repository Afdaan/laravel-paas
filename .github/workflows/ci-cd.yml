name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            backend:
              - 'backend/**'
              - '!backend/cmd/worker/**'
              - '!backend/internal/workers/**'
              - '!backend/internal/services/worker/**'
            worker:
              - 'backend/cmd/worker/**'
              - 'backend/internal/workers/**'
              - 'backend/internal/services/worker/**'
              - 'docker/worker/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'scripts/**'
              - '.github/workflows/**'

      - name: Sync codebase to Production
        run: |
          TARGET_DIR="/opt/laravel-paas"
          cd "$TARGET_DIR"
          git config --global --add safe.directory "$TARGET_DIR"
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}

      - name: Conditional Deployment
        run: |
          cd /opt/laravel-paas
          chmod +x ./scripts/deploy-app.sh
          
          BACKEND="${{ steps.filter.outputs.backend }}"
          WORKER="${{ steps.filter.outputs.worker }}"
          FRONTEND="${{ steps.filter.outputs.frontend }}"
          INFRA="${{ steps.filter.outputs.infra }}"

          if [ "$INFRA" == "true" ]; then
            echo "[CI/CD] Infrastructure changes detected. Deploying ALL to apply configuration."
            ./scripts/deploy-app.sh all
          elif [ "$WORKER" == "true" ]; then
            echo "[CI/CD] Worker changes detected. Deploying WORKER."
            ./scripts/deploy-app.sh worker
          elif [ "$BACKEND" == "true" ] && [ "$FRONTEND" == "true" ]; then
            echo "[CI/CD] Both source components changed. Deploying ALL."
            ./scripts/deploy-app.sh all
          elif [ "$BACKEND" == "true" ]; then
            echo "[CI/CD] Only Backend source changed. Deploying BACKEND."
            ./scripts/deploy-app.sh backend
          elif [ "$FRONTEND" == "true" ]; then
            echo "[CI/CD] Only Frontend source changed. Deploying FRONTEND."
            ./scripts/deploy-app.sh frontend
          else
            echo "[CI/CD] No relevant changes detected. Skipping deployment."
          fi

      - name: Notification on success
        if: success()
        run: |
          set +x
          if [ -f /opt/laravel-paas/.env ]; then
            set -a; source /opt/laravel-paas/.env; set +a
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi

          cd /opt/laravel-paas
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          LAST_COMMIT_MSG=$(git log -1 --pretty=format:"%s" | sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g')

          MSG="DEPLOY SUCCESS%0A"
          MSG="${MSG}Branch: ${{ github.ref_name }}%0A"
          MSG="${MSG}Commit: $COMMIT_HASH%0A"
          MSG="${MSG}Log: $LAST_COMMIT_MSG"

          TELEGRAM_API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          IFS=',' read -ra CHAT_IDS <<< "$TELEGRAM_CHAT_ID"
          for CHAT_ID in "${CHAT_IDS[@]}"; do
            curl -s -X POST "$TELEGRAM_API" -d chat_id="$CHAT_ID" -d text="$MSG" -d parse_mode="HTML" > /dev/null 2>&1
          done

      - name: Notification on failure
        if: failure()
        run: |
          set +x
          if [ -f /opt/laravel-paas/.env ]; then
             set -a; source /opt/laravel-paas/.env; set +a
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then exit 0; fi
          
          cd /opt/laravel-paas
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")

          MSG="DEPLOY FAILED%0A"
          MSG="${MSG}Branch: ${{ github.ref_name }}%0A"
          MSG="${MSG}Commit: $COMMIT_HASH"

          TELEGRAM_API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          IFS=',' read -ra CHAT_IDS <<< "$TELEGRAM_CHAT_ID"
          for CHAT_ID in "${CHAT_IDS[@]}"; do
            curl -s -X POST "$TELEGRAM_API" -d chat_id="$CHAT_ID" -d text="$MSG" -d parse_mode="HTML" > /dev/null 2>&1
          done