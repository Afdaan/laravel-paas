name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]

jobs:
  lint-backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Lint backend
        run: |
          cd backend
          docker run --rm \
            --user $(id -u):$(id -g) \
            -e GOLANGCI_LINT_CACHE=/tmp/golangci-lint-cache \
            -v $(pwd):/app \
            -w /app \
            golangci/golangci-lint:v1.59.1-alpine \
            golangci-lint run ./...

  lint-frontend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Lint frontend
        run: |
          cd frontend
          docker run --rm \
            --user $(id -u):$(id -g) \
            -e HOME=/tmp \
            -v $(pwd):/app \
            -w /app \
            node:20-alpine \
            sh -c "npm install && npm run lint && rm -rf node_modules"

  deploy:
    runs-on: self-hosted
    needs: [lint-backend, lint-frontend]
    steps:
      - name: Sync codebase
        run: |
          TARGET_DIR="/opt/laravel-paas"
          if [ ! -d "$TARGET_DIR" ]; then
            exit 1
          fi
          
          cd "$TARGET_DIR"
          git config --global --add safe.directory "$TARGET_DIR"
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}

      - name: Restart infrastructure
        run: |
          cd /opt/laravel-paas
          if [ -f "./scripts/start.sh" ]; then
            chmod +x ./scripts/start.sh
            ./scripts/start.sh
          else
            exit 1
          fi

      - name: Notification on success
        if: success()
        run: |
          set +x
          if [ -f /opt/laravel-paas/.env ]; then
            set -a; source /opt/laravel-paas/.env; set +a
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi

          cd /opt/laravel-paas
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          LAST_COMMIT_MSG=$(git log -1 --pretty=format:"%s" | sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g')

          MSG="DEPLOY SUCCESS%0A"
          MSG="${MSG}Branch: ${{ github.ref_name }}%0A"
          MSG="${MSG}Commit: $COMMIT_HASH%0A"
          MSG="${MSG}Log: $LAST_COMMIT_MSG"

          TELEGRAM_API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          IFS=',' read -ra CHAT_IDS <<< "$TELEGRAM_CHAT_ID"
          for CHAT_ID in "${CHAT_IDS[@]}"; do
            curl -s -X POST "$TELEGRAM_API" -d chat_id="$CHAT_ID" -d text="$MSG" -d parse_mode="HTML" > /dev/null 2>&1
          done

      - name: Notification on failure
        if: failure()
        run: |
          set +x
          if [ -f /opt/laravel-paas/.env ]; then
             set -a; source /opt/laravel-paas/.env; set +a
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then exit 0; fi
          
          cd /opt/laravel-paas
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")

          MSG="DEPLOY FAILED%0A"
          MSG="${MSG}Branch: ${{ github.ref_name }}%0A"
          MSG="${MSG}Commit: $COMMIT_HASH"

          TELEGRAM_API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          IFS=',' read -ra CHAT_IDS <<< "$TELEGRAM_CHAT_ID"
          for CHAT_ID in "${CHAT_IDS[@]}"; do
            curl -s -X POST "$TELEGRAM_API" -d chat_id="$CHAT_ID" -d text="$MSG" -d parse_mode="HTML" > /dev/null 2>&1
          done