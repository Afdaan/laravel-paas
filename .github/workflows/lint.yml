name: lint-pull-request

on:
  pull_request:
    branches: [ "**" ]

jobs:
  lint-backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Lint backend
        run: |
          cd backend
          docker run --rm \
            --user $(id -u):$(id -g) \
            -e GOLANGCI_LINT_CACHE=/tmp/golangci-lint-cache \
            -e GOCACHE=/tmp/go-build-cache \
            -e GOMODCACHE=/tmp/go-mod-cache \
            -v $(pwd):/app \
            -w /app \
            golangci/golangci-lint:v1.59.1-alpine \
            golangci-lint run --timeout 5m ./...

  lint-frontend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Lint frontend
        run: |
          cd frontend
          rm -rf node_modules
          mkdir -p .npm-cache
          docker run --rm \
            --user $(id -u):$(id -g) \
            -e HOME=/tmp \
            -v $(pwd)/.npm-cache:/tmp/.npm \
            -v $(pwd):/app \
            -w /app \
            node:20-alpine \
            sh -c "npm config set fetch-retry-maxtimeout 600000 && npm config set fetch-retries 5 && npm ci && npm run lint"
