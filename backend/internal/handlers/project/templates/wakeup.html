<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #050507;
            color: #fafafa;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background-color: #09090b;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.6s ease-out;
        }
        /* Sleek horizontal loading bar (Vercel/Linear style) */
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2.5px;
            background-color: rgba(255, 255, 255, 0.03);
            overflow: hidden;
        }
        .progress-line {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
            position: absolute;
            left: -40%;
            animation: loading 1.8s infinite linear;
        }
        h1 {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 12px 0;
            color: #f4f4f5;
            letter-spacing: -0.01em;
            text-align: center;
        }
        p {
            font-size: 13px;
            color: #71717a;
            margin: 0 0 32px 0;
            line-height: 1.6;
            text-align: center;
            font-weight: 400;
        }
        .status-wrapper {
            display: flex;
            justify-content: center;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            transition: all 0.3s ease;
        }
        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #3b82f6;
            animation: pulse 1.6s infinite ease-in-out;
        }
        @keyframes loading {
            0% { left: -40%; }
            100% { left: 100%; }
        }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.4; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="progress-bar">
            <div class="progress-line"></div>
        </div>
        <h1>Establishing secure connection</h1>
        <p>Please wait while we optimize routing and establish a secure tunnel to your application environment.</p>
        <div class="status-wrapper">
            <span class="status-badge" id="status">
                <div class="pulse-dot"></div>
                <span>Resolving Route</span>
            </span>
        </div>
    </div>

    <script>
        const subdomain = "{{.Subdomain}}";
        const statuses = [
            "Resolving Route",
            "Initializing Port",
            "Securing Connection",
            "Routing Requests"
        ];
        let statusIndex = 0;

        // Covertly rotate status messages to make it feel alive and highly professional
        setInterval(() => {
            statusIndex = (statusIndex + 1) % statuses.length;
            const statusSpan = document.getElementById("status").querySelector("span");
            if (statusSpan) {
                statusSpan.style.opacity = 0;
                setTimeout(() => {
                    statusSpan.textContent = statuses[statusIndex];
                    statusSpan.style.opacity = 1;
                }, 200);
            }
        }, 3500);

        async function triggerWakeup() {
            try {
                const res = await fetch("/proxy/wakeup?subdomain=" + subdomain + "&perform_wakeup=true");
                if (res.ok) {
                    const statusSpan = document.getElementById("status").querySelector("span");
                    if (statusSpan) statusSpan.textContent = "Connecting";
                    window.location.reload();
                } else {
                    setTimeout(triggerWakeup, 2000);
                }
            } catch (err) {
                setTimeout(triggerWakeup, 2000);
            }
        }
        triggerWakeup();
    </script>
</body>
</html>
